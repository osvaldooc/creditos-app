name: Compilar APK

on:
  workflow_dispatch:        # botón manual en la pestaña Actions
  release:
    types: [published]      # se ejecuta al publicar una Release

permissions:
  contents: write           # necesario para adjuntar el APK a la Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repositorio solo guarda lib/, assets/ y pubspec.yaml.
      # Aquí se genera la carpeta android/ y se restauran nuestros archivos.
      - name: Generar proyecto Android
        run: |
          mkdir -p /tmp/bak
          cp -r lib assets pubspec.yaml /tmp/bak/
          flutter create . --platforms=android --org com.miempresa --project-name creditos_app
          rm -rf lib assets pubspec.yaml test
          cp -r /tmp/bak/lib /tmp/bak/assets .
          cp /tmp/bak/pubspec.yaml .
          sed -i 's/android:label="creditos_app"/android:label="Créditos"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Renombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk creditos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: creditos-apk
          path: creditos.apk

      - name: Adjuntar APK a la Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" creditos.apk --clobber
